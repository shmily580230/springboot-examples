server:
  port: 8083 # Spring MVC（触发原生 Triple RPC 的 controller），避免与 8080/8081/8082 冲突

spring:
  application:
    name: springboot-dubbo3-consumer

dubbo:
  application:
    name: springboot-dubbo3-consumer
  registry:
    # Nacos 主端口 8848；gRPC 端口 9848 由 SDK 自动推导（=8848+1000），不要把 9848 写进地址。
    address: nacos://127.0.0.1:8848
    register-mode: instance                  # 应用级服务发现（Dubbo3 推荐）
    parameters.register-consumer-url: true
  # consumer 不导出服务，故不配 protocol.port；@DubboReference 按 Nacos 中 provider 的 tri URL 走 Triple。
