server:
  port: 8094 # 避开现有 8081~8083、8091~8093；仅用于触发 Nacos 注册 + /health 探活（业务流量在 gRPC 9090）

spring:
  application:
    name: grpc-provider # consumer 的 discovery:///grpc-provider 按此寻址
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848 # Nacos 主端口；gRPC 9848 由 SDK 自动推导，不要写进地址
        # gRPC 端口随注册 metadata 下发：实例注册的是 HTTP 8094，devh 的 DiscoveryClientNameResolver
        # 优先读 metadata 里的 gRPC.port（旧键 gRPC_port 也认），据此拨到 9090
        metadata:
          "gRPC.port": 9090

grpc:
  server:
    port: 9090 # gRPC 端口
    # 生产常用（演示默认即可）：max-inbound-message-size、graceful-shutdown、keep-alive 等
